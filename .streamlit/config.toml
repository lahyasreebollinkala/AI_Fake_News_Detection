# ---------------------------------------------------------------------------
# Veritas theme -- light + dark variants.
# Both blocks are defined so readers can switch modes from the settings menu.
# ---------------------------------------------------------------------------

[theme]
baseRadius = "0.65rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
baseFontSize = 15

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Outfit':https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.82rem"

headingFontSizes = ["2.1rem", "1.55rem", "1.2rem", "1.02rem", "0.9rem", "0.8rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]

# --- Brand palette ---------------------------------------------------------
# Indigo is the neutral "system" accent; emerald = authentic, rose = fabricated.
chartCategoricalColors = ["#4F46E5", "#0E9F6E", "#E11D48", "#0EA5E9", "#8B5CF6", "#D97706", "#6B7280"]
chartSequentialColors = ["#EEF0FE", "#D9DDFC", "#BFC4FA", "#A3AAF7", "#868FF3", "#6A74EF", "#4F46E5", "#4038C8", "#332B9E", "#261F73"]

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7FB"
textColor = "#1F2333"
borderColor = "#E3E5EE"
linkColor = "#4338CA"
codeTextColor = "#1F2333"
codeBackgroundColor = "#F1F2F7"

redColor = "#E11D48"
orangeColor = "#C2690B"
yellowColor = "#A16207"
greenColor = "#0E9F6E"
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#5F6478"

redBackgroundColor = "#FCE7EC"
redTextColor = "#9F1239"
greenBackgroundColor = "#DFF5EC"
greenTextColor = "#046B4A"
orangeBackgroundColor = "#FDF0DC"
orangeTextColor = "#8A4B06"
blueBackgroundColor = "#E2ECFD"
blueTextColor = "#1D4ED8"
violetBackgroundColor = "#EFE7FD"
violetTextColor = "#5B21B6"

dataframeBorderColor = "#E3E5EE"
dataframeHeaderBackgroundColor = "#F6F7FB"

[theme.light.sidebar]
